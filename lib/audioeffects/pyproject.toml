[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pydevices-audioeffects"
dynamic = ["version"]
description = "Audio effects built on audioif's audio nodes for PyDevices"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "PyDevices contributors"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
# The audioif floor is the newest audioif RELEASE. It is not the pin:
# AUDIOIF_PIN (repo root) names the exact commit the gates run against,
# and may sit ahead of any release.
# TODO: raise this floor to the audioif release that AUDIOIF_PIN names,
# once that release exists (audiocomponents#2, the audioif step).
dependencies = ["pydevices-audioif>=0.1.1"]

[project.urls]
Repository = "https://github.com/PyDevices/audiocomponents"
Issues = "https://github.com/PyDevices/audiocomponents/issues"

[tool.setuptools]
packages = ["audioeffects"]

[tool.setuptools.package-dir]
audioeffects = "."

[tool.setuptools.dynamic]
version = {file = "VERSION"}
