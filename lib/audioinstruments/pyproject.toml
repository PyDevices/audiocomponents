[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pydevices-audioinstruments"
dynamic = ["version"]
description = "Classic synthesizers, electromechanical keyboards, and drum machines for PyDevices"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "PyDevices contributors"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
# The audioif floor is the newest audioif RELEASE. It is not the pin:
# AUDIOIF_PIN (repo root) names the exact commit the gates run against,
# and may sit ahead of any release.
dependencies = ["pydevices-audioif>=0.2.0"]

[project.urls]
Repository = "https://github.com/PyDevices/audiocomponents"
Issues = "https://github.com/PyDevices/audiocomponents/issues"

[tool.setuptools]
packages = ["audioinstruments"]

[tool.setuptools.package-dir]
audioinstruments = "."

[tool.setuptools.dynamic]
version = {file = "VERSION"}
