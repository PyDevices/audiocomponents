# Keep pinned GitHub Actions current. Nothing else here is managed by
# Dependabot: the only Python dependency is audioif, pinned deliberately in
# AUDIOIF_PIN and moved by hand with the gates re-run.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 3
