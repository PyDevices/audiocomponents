name: Publish release packages

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release-ref:
        description: Exact vX.Y.Z tag to retry
        required: true
        type: string

# publishing-v5 needs contents:write (attach release assets) and
# id-token:write (PyPI Trusted Publishing); a called workflow may not
# exceed the caller's grant, so the ceiling is set here.
permissions:
  contents: write
  id-token: write

jobs:
  gates:
    # The structural gates tests.yml runs, against the audiodsp pin: a release
    # must not ship what CI would not pass. The instrument parity gate stays
    # workspace-local (see AGENTS.md), here as everywhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # AUDIODSP_PIN, not the dependency floor in pyproject.toml: the gates
      # are only attributable against a fixed core.
      - name: Resolve the audiodsp pin
        id: pin
        run: |
          tag=$(grep -v '^[[:space:]]*#' AUDIODSP_PIN | grep -v '^[[:space:]]*$' \
                | head -1 | awk '{print $1}')
          if [[ -z "$tag" ]]; then
            echo "AUDIODSP_PIN has no pin line" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "audiodsp pinned at $tag"

      # No distribution name in the requirement: the pinned commit's own
      # pyproject.toml names it (pydevices-audiodsp before the rename,
      # omnipython-audiodsp after), as in tests.yml.
      - name: Install audiodsp at the pin
        run: >-
          python -m pip install
          "git+https://github.com/PyDevices/audiodsp@${{ steps.pin.outputs.tag }}"

      # numpy: two tests need it (test_cpython_asym_table through the ulab
      # bridge, test_rig_comparator directly); the packages themselves do not.
      # pytest and pytest-xdist run the suite in parallel, as tests.yml does.
      - run: python -m pip install numpy pytest pytest-xdist

      # --no-deps is load-bearing: without it a floor raised above the pinned
      # release re-resolves audiodsp from the index and every
      # measurement is taken against a core AUDIODSP_PIN does not name -- the
      # failure the pin exists to prevent, arriving through packaging. Do not
      # drop the flag.
      - run: python -m pip install --no-deps -e lib/audioinstruments -e lib/audioeffects

      # The probe WAVs are not in git. Generate them here, so a probe that no
      # longer matches probes.json fails this step by name instead of inside
      # a test. The tests would generate them too; this makes it explicit.
      - run: python tools/effect_probes/make_probes.py --ensure

      - run: python -m pytest tests -n auto --dist loadscope -p no:cacheprovider
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
      - run: python tools/validate_api.py
      - run: python tests/parity/effects_library_smoke.py

  credentials:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm inherited TestPyPI credentials
        env:
          TESTPYPI_API_TOKEN: ${{ secrets.TESTPYPI_API_TOKEN }}
        run: |
          if [[ -z "$TESTPYPI_API_TOKEN" ]]; then
            echo "TESTPYPI_API_TOKEN is unavailable; ensure the organization secret is visible to PyDevices/audiocomponents." >&2
            exit 1
          fi

  publish-audioinstruments:
    needs:
      - gates
      - credentials
    uses: PyDevices/.github/.github/workflows/reusable-publish-release-packages.yml@publishing-v15
    with:
      build-kind: pure-python
      distribution-name: pydevices-audioinstruments
      import-name: audioinstruments
      install-dependencies: true
      working-directory: lib/audioinstruments
      # Both MIP index entries ride on this one call, as they rode on
      # audiodsp's core job before publishing moved here: the request reusable
      # sends one dispatch per comma-separated profile and mip serializes them
      # in its publication queue. MIP publishes lib/<package> from the tag,
      # not the wheel, so neither entry waits on a TestPyPI upload.
      mip-profile: audioinstruments,audioeffects
      release-ref: ${{ inputs.release-ref }}
    secrets: inherit

  publish-audioeffects:
    needs:
      - gates
      - credentials
    uses: PyDevices/.github/.github/workflows/reusable-publish-release-packages.yml@publishing-v15
    with:
      build-kind: pure-python
      distribution-name: pydevices-audioeffects
      import-name: audioeffects
      install-dependencies: true
      working-directory: lib/audioeffects
      release-ref: ${{ inputs.release-ref }}
    secrets: inherit
