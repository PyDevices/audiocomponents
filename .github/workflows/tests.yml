# The structural contract: everything that can run without a workspace.
#
# The instrument parity gate is deliberately absent. It needs built
# MicroPython/CircuitPython interpreters and a micropython-vst3 checkout as
# workspace siblings, so an external runner cannot execute it and pretending
# otherwise would turn a real gate into a skipped one. See AGENTS.md.
name: Tests

# Once per change: pushes to main and pull requests. Documentation-only changes
# skip it; the two package READMEs under lib/ are not skipped, because tests
# read them and the wheels carry them. So does a release pull request, which
# changes only VERSION and CHANGELOG.md, and its merge: the code it releases
# already passed here, and publish-release-packages.yml runs the suite again
# at the release tag before anything is published.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'ROADMAP.md', 'CHANGELOG.md', 'AGENTS.md', 'LICENSE', 'VERSION']
  pull_request:
    # `labeled` too: adding the `lifecycle: all classes` label re-runs the
    # pull request with the whole lifecycle matrix (see the test step).
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: ['docs/**', 'README.md', 'ROADMAP.md', 'CHANGELOG.md', 'AGENTS.md', 'LICENSE', 'VERSION']
  # The full matrix on demand, for a branch that should see every Python
  # before it merges rather than after.
  workflow_dispatch:

# A new push to a pull request cancels the run it supersedes: only the newest
# commit's result is ever read. Pushes to main are never cancelled or queued
# behind one another (each gets a group of its own), so every commit on main
# keeps its own full-matrix record.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Every supported Python on main and on a manual run; on a pull
        # request only 3.13, the Python the other two platforms run. A failure
        # only another Python shows surfaces on the push to main, or sooner
        # from a manual run on the branch.
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.13"]' || '["3.11", "3.12", "3.13", "3.14"]') }}
        include:
          # The components are pure Python; the platform variance comes from
          # audiodsp's extension underneath them, so one Python is enough to
          # prove the other two platforms.
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    env:
      # The lifecycle matrices (quick mode). All 45 classes take about 4.4
      # CPU hours, over an hour on this runner, and the 13 audiodsp nodes
      # under them half an hour more on one worker, so a pull request runs
      # only what its change can move: the class or node whose own code
      # changed, and when a shared file changed (the base class, the
      # matrix, the pin) a fixed sample of each, nine classes in about 13
      # minutes and four nodes in about five (SAMPLE in
      # tests/test_lifecycle_matrix.py, NODE_SAMPLE in
      # tests/test_node_matrix.py). A push to main runs every class and
      # every node, and so does a manual run (workflow_dispatch) or a pull
      # request labelled `lifecycle: all classes`.
      LIFECYCLE_CHANGED_FROM: "${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'lifecycle: all classes') && format('origin/{0}', github.base_ref) || '' }}"
    steps:
      # A pull request fetches its history, so the matrices can ask git what
      # the change touches against origin/<base> (LIFECYCLE_CHANGED_FROM).
      # Written `!= ... && 1 || 0` because `== ... && 0 || 1` is always 1:
      # 0 is false in an expression, so the `||` took over and every pull
      # request checked out at depth 1. With no base to diff from, the
      # matrix then fell back to all 45 classes, and a pull request ran
      # 1 h 43 min. A base git cannot diff from is now an error instead.
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # AUDIODSP_PIN, not the latest release: the gates below are only
      # attributable against a fixed core. A component failure over a moving
      # audiodsp cannot be told apart from a node that moved beneath it.
      - name: Resolve the audiodsp pin
        id: pin
        shell: bash
        run: |
          tag=$(grep -v '^[[:space:]]*#' AUDIODSP_PIN | grep -v '^[[:space:]]*$' \
                | head -1 | awk '{print $1}')
          if [[ -z "$tag" ]]; then
            echo "AUDIODSP_PIN has no pin line" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "audiodsp pinned at $tag"

      # Building audiodsp's extension from source is the slowest install here,
      # and its output depends only on the pin, the platform and the Python.
      # Build the wheel once per combination and keep it.
      - name: Cache the audiodsp wheel
        id: audiodsp-wheel
        uses: actions/cache@v6
        with:
          path: .audiodsp-wheel
          key: audiodsp-wheel-v1-${{ steps.pin.outputs.tag }}-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python }}

      # The requirement carries no distribution name: audiodsp was renamed
      # from pydevices-audiodsp to omnipython-audiodsp, and the name pip
      # checks must be the one the pinned commit declares. Without a name,
      # pip reads it from that commit's pyproject.toml.
      - name: Build the audiodsp wheel at the pin
        if: steps.audiodsp-wheel.outputs.cache-hit != 'true'
        run: >-
          python -m pip wheel --no-deps --wheel-dir .audiodsp-wheel
          "git+https://github.com/PyDevices/audiodsp@${{ steps.pin.outputs.tag }}"

      - name: Install audiodsp at the pin
        shell: bash
        run: python -m pip install .audiodsp-wheel/*audiodsp-*.whl

      # Editable, so the tests exercise lib/ directly rather than a copy, and
      # so each package's own pyproject.toml is exercised too.
      # numpy: two tests need it (test_cpython_asym_table through the ulab
      # bridge, test_rig_comparator directly); the packages themselves do not.
      # pytest and pytest-xdist run the suite below; the tests are plain
      # unittest and need neither.
      - run: python -m pip install numpy pytest pytest-xdist

      # --no-deps is load-bearing: without it a floor raised above the pinned
      # release re-resolves audiodsp from the index and every
      # measurement is taken against a core AUDIODSP_PIN does not name -- the
      # failure the pin exists to prevent, arriving through packaging. Do not
      # drop the flag.
      - run: python -m pip install --no-deps -e lib/audioinstruments -e lib/audioeffects

      # The probe WAVs are not in git. Generate them here, so a probe that no
      # longer matches probes.json fails this step by name instead of inside
      # a test. The tests would generate them too; this makes it explicit.
      - run: python tools/effect_probes/make_probes.py --ensure

      # What the two matrices will run, in the log where a reader can check
      # it, and a scope git cannot work out fails here by name.
      - name: Show the lifecycle scope
        shell: bash
        run: >-
          python -c "from tests.test_lifecycle_matrix import classes;
          from tests.test_node_matrix import names;
          print('base:', '${LIFECYCLE_CHANGED_FROM:-none, all}');
          print('classes:', ' '.join(classes()) or 'none');
          print('nodes:', ' '.join(names()) or 'none')"

      # A pull request runs only the tests its change can move: the test
      # files it edits, the tests of each effect class whose module it edits,
      # and the kit, the contract and the two lifecycle matrices, which
      # every pull request runs. A change to shared code (the kit, the base
      # class, tests/support, the probes, the pin, this workflow) or to a
      # file with no tests of its own runs the whole suite. So do pushes to
      # main and manual runs, on every Python. tools/scoped_tests.py --ci
      # holds the mapping and prints why it chose what it chose.
      - name: Choose the tests
        id: scope
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            files=$(python tools/scoped_tests.py --ci "origin/${{ github.base_ref }}")
          else
            files=full
          fi
          if [[ "$files" == full ]]; then
            files=tests
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "running: $files"

      # The same tests `python -m unittest discover -s tests -p "test_*.py"`
      # finds (or the pull request's share of them, above), spread across
      # every core the runner has: serially the suite
      # takes over an hour. A test that writes a file writes it into its own
      # temporary directory, so no two workers collide. loadscope keeps each
      # class on one worker, in unittest's order, with one setUpClass;
      # tests/conftest.py starts the slowest class first. --durations names
      # the slowest tests, which bound how fast this step can get.
      # One BLAS thread per process: every core already runs a test process,
      # and numpy would otherwise start a BLAS thread per core in each one.
      - run: python -m pytest ${{ steps.scope.outputs.files }} -n auto --dist loadscope -p no:cacheprovider --durations=25
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
      - run: python tools/validate_api.py
      - run: python tests/parity/effects_library_smoke.py

  # The job above installs lib/ editable, which serves every file on disk and
  # so cannot see a subpackage pyproject.toml leaves out -- v0.3.0 shipped an
  # audioeffects wheel without audioeffects.rebuilt and it failed on import.
  # This builds both wheels as a release does, checks every source module is
  # in them, and imports and renders from a clean venv at the audiodsp pin.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python tools/wheel_gate.py
