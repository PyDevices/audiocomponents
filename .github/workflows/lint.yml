name: Lint

on:
  push:
  pull_request:

jobs:
  flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Configured in .flake8: defect checks only, no formatting rules. The
      # instrument modules are deliberately compact and generated modules put
      # MACRO_LABELS above their imports, so layout is not gated here.
      - run: python -m pip install flake8
      # Nothing here imports the packages, so lint needs neither audioif nor
      # an install of its own.
      - run: python -m flake8
