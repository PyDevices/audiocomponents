name: Lint

# Once per change: pushes to main and pull requests; documentation-only changes skip it.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']

jobs:
  flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # Configured in .flake8: defect checks only, no formatting rules. The
      # instrument modules are deliberately compact and generated modules put
      # MACRO_LABELS above their imports, so layout is not gated here.
      - run: python -m pip install flake8
      # Nothing here imports the packages, so lint needs neither audiodsp nor
      # an install of its own.
      - run: python -m flake8

  # Audio is generated, never committed: the measurement kit's probes come
  # from tools/effect_probes/make_probes.py, on demand.
  no-wav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No WAV files are tracked
        shell: bash
        run: |
          tracked=$(git ls-files '*.wav' '*.WAV')
          if [[ -n "$tracked" ]]; then
            echo "WAV files are tracked:" >&2
            echo "$tracked" >&2
            echo "Probes are generated by tools/effect_probes/make_probes.py;" \
                 "remove these with git rm --cached." >&2
            exit 1
          fi
          echo "no WAV files tracked"
